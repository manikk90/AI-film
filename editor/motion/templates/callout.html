<!doctype html>
<html><head><meta charset="utf-8"><title>callout</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas></canvas>
<script type="application/json" id="meta">{"description": "A circle that draws around a point (x, y in 0-1) with an arrow and a label", "duration": 3, "vars": {"x": 0.5, "y": 0.45, "radius": 0.09, "label": "Yahan dekho"}, "name": "callout"}</script>
<script>
/* Mann motion template `callout` (see editor/motion/lib.js for the contract). */
const MOTION = {
defaults: JSON.parse(document.getElementById('meta').textContent).vars,
render(ctx, t, v, W, H) {
  const s = M.safe(W, H, v), base = Math.min(W, H), e = M.env(t, v.duration, 0.25, 0.35);
  const px = v.x * W, py = v.y * H, r = v.radius * base, lw = base * 0.012;
  const draw = M.outCubic(M.prog(t, 0, 0.55)), pulse = 1 + 0.05 * Math.sin(Math.max(0, t - 0.6) * 6);
  ctx.save(); ctx.globalAlpha = e; M.shadow(ctx, true);
  ctx.strokeStyle = v.accent; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(px, py, r * pulse, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * draw); ctx.stroke();
  const left = v.x > 0.5, ls = M.fit(ctx, v.label, s.w * 0.5, base * 0.045, v, 'display');
  ctx.font = M.font(v, 'display', ls); const lw2 = ctx.measureText(v.label).width + base * 0.05, lh = ls * 1.6;
  const lx = M.clamp(left ? px - r - base * 0.12 - lw2 : px + r + base * 0.12, s.x0, s.x1 - lw2), ly = M.clamp(py - r - lh - base * 0.04, s.y0, s.y1 - lh);
  const a = M.outCubic(M.prog(t, 0.45, 0.8));
  const sx = px + (left ? -1 : 1) * r * 0.75, sy = py - r * 0.75, ex = left ? lx + lw2 : lx, ey = ly + lh / 2;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(M.lerp(sx, ex, a), M.lerp(sy, ey, a)); ctx.stroke();
  ctx.globalAlpha = e * M.prog(t, 0.6, 0.9);
  ctx.fillStyle = v.accent; M.rrect(ctx, lx, ly, lw2, lh, lh / 2); ctx.fill();
  ctx.fillStyle = v.bg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; M.shadow(ctx, false);
  ctx.fillText(v.label, lx + lw2 / 2, ly + lh / 2); ctx.restore();
}
};
</script>
<script src="../lib.js"></script>
</body></html>
