<!doctype html>
<html><head><meta charset="utf-8"><title>counter</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas></canvas>
<script type="application/json" id="meta">{"description": "A number that counts up (Indian grouping by default) with a label", "duration": 3, "vars": {"from": 0, "to": 100000, "prefix": "", "suffix": "", "label": "views", "decimals": 0, "locale": "en-IN"}, "name": "counter"}</script>
<script>
/* Mann motion template `counter` (see editor/motion/lib.js for the contract). */
const MOTION = {
defaults: JSON.parse(document.getElementById('meta').textContent).vars,
render(ctx, t, v, W, H) {
  const s = M.safe(W, H, v), base = Math.min(W, H), e = M.env(t, v.duration, 0.3, 0.35);
  const k = M.outCubic(M.prog(t, 0.15, Math.max(0.6, v.duration * 0.7)));
  const fmt = new Intl.NumberFormat(v.locale, { minimumFractionDigits: v.decimals, maximumFractionDigits: v.decimals });
  const text = v.prefix + fmt.format(M.lerp(+v.from, +v.to, k)) + v.suffix, finalText = v.prefix + fmt.format(+v.to) + v.suffix;
  const size = M.fit(ctx, finalText, s.w * 0.9, base * 0.17, v, 'display'), pop = 1 + 0.08 * Math.sin(Math.PI * M.prog(t, v.duration * 0.7, v.duration * 0.7 + 0.3));
  const cx = (s.x0 + s.x1) / 2, cy = M.cy(s, H, v, 0.4);
  ctx.save(); ctx.globalAlpha = e; ctx.translate(cx, cy); ctx.scale(pop, pop);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; M.shadow(ctx, true);
  ctx.fillStyle = v.accent; ctx.font = M.font(v, 'display', size); ctx.fillText(text, 0, 0); ctx.restore();
  if (v.label) {
    ctx.save(); ctx.globalAlpha = e * M.prog(t, 0.3, 0.7); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; M.shadow(ctx, true);
    const ls = M.fit(ctx, v.label, s.w * 0.85, base * 0.05, v, 'text'); ctx.fillStyle = v.ink; ctx.font = M.font(v, 'text', ls);
    ctx.fillText(v.label, cx, cy + size * 0.65); ctx.restore();
  }
}
};
</script>
<script src="../lib.js"></script>
</body></html>
