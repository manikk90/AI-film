<!doctype html>
<html><head><meta charset="utf-8"><title>progress-bar</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas></canvas>
<script type="application/json" id="meta">{"description": "A thin bar that fills across the whole clip (retention cue)", "duration": 15, "vars": {"position": "top", "label": ""}, "name": "progress-bar"}</script>
<script>
/* Mann motion template `progress-bar` (see editor/motion/lib.js for the contract). */
const MOTION = {
defaults: JSON.parse(document.getElementById('meta').textContent).vars,
render(ctx, t, v, W, H) {
  const s = M.safe(W, H, v), base = Math.min(W, H), th = Math.max(4, H * 0.007);
  const y = v.position === 'bottom' ? s.y1 - th : s.y0 - th * 2.5, k = M.prog(t, 0, v.duration);
  ctx.save(); ctx.globalAlpha = M.prog(t, 0, 0.3);
  ctx.fillStyle = M.alpha(v.ink, 0.25); M.rrect(ctx, s.x0, y, s.w, th, th / 2); ctx.fill();
  ctx.fillStyle = v.accent; M.rrect(ctx, s.x0, y, Math.max(th, s.w * k), th, th / 2); ctx.fill();
  if (v.label) { ctx.fillStyle = v.ink; ctx.textBaseline = 'bottom'; ctx.font = M.font(v, 'text', base * 0.03); ctx.fillText(v.label, s.x0, y - th); }
  ctx.restore();
}
};
</script>
<script src="../lib.js"></script>
</body></html>
