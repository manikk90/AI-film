<!doctype html>
<html><head><meta charset="utf-8"><title>stat-card</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas></canvas>
<script type="application/json" id="meta">{"description": "A frosted card that slides up with a counting number and a label", "duration": 3.5, "vars": {"from": 0, "value": 72, "suffix": "%", "label": "log yeh nahi jaante", "decimals": 0, "locale": "en-IN"}, "name": "stat-card"}</script>
<script>
/* Mann motion template `stat-card` (see editor/motion/lib.js for the contract). */
const MOTION = {
defaults: JSON.parse(document.getElementById('meta').textContent).vars,
render(ctx, t, v, W, H) {
  const s = M.safe(W, H, v), base = Math.min(W, H), e = M.env(t, v.duration, 0.5, 0.35);
  const cw = s.w * 0.86, ch = base * 0.46, cx = (s.x0 + s.x1) / 2, cy = M.cy(s, H, v, 0.42) + (1 - e) * base * 0.08;
  const k = M.outCubic(M.prog(t, 0.3, Math.max(0.8, v.duration * 0.7)));
  const fmt = new Intl.NumberFormat(v.locale, { minimumFractionDigits: v.decimals, maximumFractionDigits: v.decimals });
  ctx.save(); ctx.globalAlpha = e; M.shadow(ctx, true);
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; M.rrect(ctx, cx - cw / 2, cy - ch / 2, cw, ch, base * 0.04); ctx.fill(); M.shadow(ctx, false);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = base * 0.004; ctx.stroke();
  const num = fmt.format(M.lerp(+v.from, +v.value, k)) + v.suffix, ns = M.fit(ctx, fmt.format(+v.value) + v.suffix, cw * 0.85, base * 0.17, v, 'display', 900);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = v.accent; ctx.font = M.font(v, 'display', ns, 900); ctx.fillText(num, cx, cy - ch * 0.1);
  const ls = M.fit(ctx, v.label, cw * 0.85, base * 0.045, v, 'text'); ctx.fillStyle = v.ink; ctx.font = M.font(v, 'text', ls); ctx.fillText(v.label, cx, cy + ch * 0.3);
  ctx.restore();
}
};
</script>
<script src="../lib.js"></script>
</body></html>
