<!doctype html>
<!--
  living-painting template (studio, 2026-11-14). A working example: an ink-wash heron over misty ridges, 6 s seamless
  loop, 1080x1920. Copy it with `python3 .claude/skills/living-painting/scripts/new_painting.py <slug> <preset>`,
  then replace the paint* functions with the scene. Keep the structure:
    1. PAINT ONCE: every textured layer is painted into an offscreen canvas in K.whenReady (paint*()).
    2. ANIMATE: render(ctx, t) only moves and combines those layers, plus the subject drawn from its pose at t.
    3. LOOP: every motion uses K.loopWave / whole cycles of DUR, so t = DUR looks exactly like t = 0.
    4. CAMERA: a slow push-in (1.0 -> ~1.3) and parallax by depth; paper grain is drawn last, fixed to the frame.
-->
<meta charset="utf-8">
<link rel="stylesheet" href="__STUDIO__/fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style>
<canvas width="1080" height="1920"></canvas>
<script src="__STUDIO__/canvas_kit.js"></script>
<script>
const K = STUDIO, W = 1080, H = 1920, DUR = 6, SEED = 11;
const L = {};                      // painted layers
const INK = [24, 22, 20];

// ---------- 1. paint once ----------------------------------------------------------------------------------------
function inkWash(c, x0, y0, w, h, alpha, seed) {           // soft ink blot built from many translucent dabs
  const r = K.rng(seed);
  for (let i = 0; i < 260; i++) {
    const x = x0 + r() * w, y = y0 + r() * h, rad = 20 + r() * 90;
    const g = c.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, `rgba(${INK},${alpha * (0.3 + 0.7 * r())})`); g.addColorStop(1, `rgba(${INK},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill();
  }
}
function paintRidge(depth, seed) {                           // a mountain ridge as a brush-edged ink shape, wider than the frame
  const ww = W + 600;
  return K.layer(ww, H, (c) => {
    const r = K.rng(seed), base = H * (0.42 + depth * 0.22), amp = 180 + depth * 160, val = 0.18 + depth * 0.55;
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= ww; x += 6) {
      const y = base - amp * (K.noise(x / 420, depth * 9, seed) * 0.8 + K.noise(x / 90, depth, seed + 1) * 0.2);
      c.lineTo(x, y + (r() - 0.5) * 3);                        // dry-brush roughness on the edge
    }
    c.lineTo(ww, H); c.closePath();
    const g = c.createLinearGradient(0, base - amp, 0, base + 260);
    g.addColorStop(0, `rgba(${INK},${val})`); g.addColorStop(1, `rgba(${INK},0)`);   // fades into mist at the foot
    c.fillStyle = g; c.fill();
    c.save(); c.clip(); inkWash(c, 0, base - amp, ww, amp + 200, val * 0.25, seed + 7); c.restore();
    for (let i = 0; i < 40; i++) {                             // dry-brush streaks along the ridge
      const x = r() * ww, y = base - amp * K.noise(x / 420, depth * 9, seed) * 0.8;
      c.strokeStyle = `rgba(${INK},${val * 0.5 * r()})`; c.lineWidth = 1 + r() * 3;
      c.beginPath(); c.moveTo(x, y + 4); c.lineTo(x + 30 + r() * 80, y + 10 + r() * 30); c.stroke();
    }
  });
}
function paintMoon() {                                       // one wet wash: ragged bled edge, darker rim where pigment dried
  return K.layer(420, 420, (c) => {
    for (let pass = 0; pass < 3; pass++) {
      c.beginPath();
      for (let a = 0; a <= 6.30; a += 0.04) {
        const rr = 128 + pass * 10 + 14 * (K.noise(a * 3, pass, SEED + 3) - 0.5) + 5 * (K.noise(a * 19, pass, SEED + 4) - 0.5);
        c.lineTo(210 + Math.cos(a) * rr, 210 + Math.sin(a) * rr);
      }
      c.closePath();
      const g = c.createRadialGradient(196, 200, 10, 210, 210, 150);
      g.addColorStop(0, `rgba(205,72,48,${0.42 - pass * 0.12})`); g.addColorStop(0.85, `rgba(190,55,40,${0.5 - pass * 0.14})`);
      g.addColorStop(1, 'rgba(190,55,40,0)');
      c.fillStyle = g; c.fill();
    }
  });
}
function paintSkyWash(seed) {                                 // faint ink clouds high in the sky, drift sideways
  return K.layer(W + 800, 700, (c) => {
    const r = K.rng(seed);
    for (let i = 0; i < 60; i++) {
      const x = r() * (W + 800), y = 80 + r() * 520, rx = 160 + r() * 260, ry = 20 + r() * 40;
      const g = c.createRadialGradient(x, y, 0, x, y, rx);
      g.addColorStop(0, `rgba(${INK},${0.035 + 0.04 * r()})`); g.addColorStop(1, `rgba(${INK},0)`);
      c.save(); c.translate(x, y); c.scale(1, ry / rx); c.translate(-x, -y);
      c.fillStyle = g; c.beginPath(); c.arc(x, y, rx, 0, 7); c.fill(); c.restore();
    }
  });
}
// reeds in the foreground: drawn per frame because they bend in the wind
const REEDS = (() => { const r = K.rng(SEED + 60); return Array.from({ length: 34 }, () => ({ x: r() * W, h: 260 + r() * 420, w: 2 + r() * 4, ph: r(), a: 0.5 + 0.45 * r() })); })();
function reeds(ctx, t) {
  for (const R of REEDS) {
    const bend = 46 * (0.6 * K.loopWave(t, DUR, 2, R.ph) + 0.4 * K.loopWave(t, DUR, 3, R.ph * 2)) * (R.h / 680);
    ctx.strokeStyle = `rgba(${INK},${R.a})`; ctx.lineWidth = R.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(R.x, H + 10); ctx.quadraticCurveTo(R.x + bend * 0.3, H - R.h * 0.5, R.x + bend, H - R.h); ctx.stroke();
  }
}
function paintMist(seed) {
  return K.layer(W + 800, 420, (c) => {
    const r = K.rng(seed);
    for (let i = 0; i < 90; i++) {
      const x = r() * (W + 800), y = 140 + r() * 160, rad = 80 + r() * 160;
      const g = c.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, 'rgba(245,240,230,0.22)'); g.addColorStop(1, 'rgba(245,240,230,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill();
    }
  });
}

// ---------- the subject: drawn from its pose each frame (it changes shape, so it is not cached) ------------------
function heron(ctx, x, y, s, wing, seed) {                    // wing in [-1, 1]: down .. up; big sweeps, filled with wash
  const r = K.rng(seed);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const far = (lift, alpha) => {                               // one wing as a tapered brush sweep with feather tips
    ctx.fillStyle = `rgba(${INK},${alpha})`;
    ctx.beginPath(); ctx.moveTo(-30, -6);
    ctx.bezierCurveTo(-20, -70 - lift * 0.5, -120, -60 - lift, -190, -30 - lift * 1.25);
    ctx.bezierCurveTo(-130, -26 - lift * 0.6, -70, -10, 30, -2);
    ctx.fill();
    ctx.strokeStyle = `rgba(${INK},${alpha})`; ctx.lineWidth = 2.2;
    for (let i = 0; i < 9; i++) {
      const fx = -190 + i * 15, fy = -30 - lift * (1.25 - i * 0.07);
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx - 14 + r() * 4, fy + 12 + r() * 6); ctx.stroke();
    }
  };
  far(wing * 120 * 0.8, 0.38);                                 // far wing, paler
  ctx.fillStyle = `rgba(${INK},0.86)`;                          // body: an ink blot elongated
  ctx.beginPath(); ctx.ellipse(-10, 0, 92, 20, -0.04, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(${INK},0.9)`; ctx.lineWidth = 9;      // S neck and head
  ctx.beginPath(); ctx.moveTo(70, -6); ctx.bezierCurveTo(110, -6, 92, -46, 128, -50); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(134, -50, 13, 9, 0, 0, 7); ctx.fill();
  ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(144, -50); ctx.lineTo(196, -44); ctx.stroke();   // beak
  ctx.fillStyle = 'rgba(196,58,42,0.9)'; ctx.beginPath(); ctx.arc(130, -58, 5, 0, 7); ctx.fill();    // red crown, the one colour
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-96, 6); ctx.lineTo(-210, 26); ctx.moveTo(-96, 10); ctx.lineTo(-205, 36); ctx.stroke();  // trailing legs
  far(wing * 120, 0.9);                                        // near wing
  ctx.restore();
}

K.whenReady(() => {
  L.paper = K.paper(W, H, SEED, 0.07, [242, 236, 222]);
  L.moon = paintMoon();
  L.far = paintRidge(0.0, SEED + 10); L.mid = paintRidge(0.5, SEED + 20); L.near = paintRidge(1.0, SEED + 30);
  L.mistA = paintMist(SEED + 40); L.mistB = paintMist(SEED + 50); L.sky = paintSkyWash(SEED + 70);
});

// ---------- 2. animate: only move and combine ---------------------------------------------------------------------
window.FILM = { DUR, init() {}, render(ctx, t) {
  const u = t / DUR;
  ctx.fillStyle = '#f2ecdf'; ctx.fillRect(0, 0, W, H);
  // camera: push in and settle back over the loop, so t = DUR matches t = 0
  const zoom = 1 + 0.15 * (1 - Math.cos(2 * Math.PI * u));            // 1.0 -> 1.3 -> 1.0
  // parallax: layers sway on one whole cycle (near ones further), so the loop closes with no jump. A one-way slide
  // only loops if the layer is painted tileable; otherwise it jumps at the seam.
  const sway = K.loopWave(t, DUR, 1);
  K.camera(ctx, { zoom, cy: H * 0.42 }, () => {
    ctx.drawImage(L.sky, -400 + 120 * K.loopWave(t, DUR, 1, 0.1), 40);   // high clouds drift
    ctx.drawImage(L.moon, 600, 330 + 6 * K.loopWave(t, DUR, 1));
    const slide = (img, depth, y = 0) => ctx.drawImage(img, -300 + 280 * depth * sway, y);
    slide(L.far, 0.33); slide(L.mistA, 0.5, H * 0.38 + 10 * K.loopWave(t, DUR, 1, 0.2));
    slide(L.mid, 0.66); slide(L.mistB, 0.85, H * 0.5 + 14 * K.loopWave(t, DUR, 1, 0.6));
    // the subject: big, clear wingbeats (3 per loop), rising and dipping, kept in the middle half of the frame
    const wing = K.loopWave(t, DUR, 3);
    const hx = W * 0.5 + 60 * K.loopWave(t, DUR, 1, 0.25), hy = H * 0.36 + 70 * K.loopWave(t, DUR, 1) - 18 * wing;
    heron(ctx, hx, hy, 1.15, wing, SEED);
    slide(L.near, 1.0);
    slide(L.mistA, 1.15, H * 0.7 + 20 * K.loopWave(t, DUR, 1, 0.4));   // low mist over the water
    reeds(ctx, t);
  });
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(L.paper, 0, 0); ctx.restore();  // paper fixed to the frame
  K.vignette(ctx, 0.18);
} };
</script>
