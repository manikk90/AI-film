[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-film-production"
version = "0.1.0"
description = "Portable screenplay-to-video production records, skills, and coverage checks"
requires-python = ">=3.9"
dependencies = []

# Install from a clone in editable mode: `pip install -e ".[media]"`. Mann and the studio read data that lives
# next to the package (editor/, styles/, studio/), so a plain non-editable install is not supported.
[project.optional-dependencies]
# what the media, render and QC tests and tools need (FFmpeg and Node Playwright are installed separately)
media = ["numpy", "Pillow"]
# heavy optional tools; bash studio/setup_env.sh installs these with the right CPU builds
studio = ["numpy", "Pillow", "librosa", "soundfile", "mediapipe", "uroman"]

[project.scripts]
aifilm = "aifilm.cli:main"
mann = "aifilm.editor.cli:main"

[tool.setuptools.packages.find]
include = ["aifilm*"]

[tool.pytest.ini_options]
# Bare `pytest` (as CI runs it) puts tests/ on sys.path, not the repo root; add the root so `aifilm` imports.
pythonpath = ["."]
testpaths = ["tests"]
