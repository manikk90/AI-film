[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-film-production"
version = "0.1.0"
description = "Portable screenplay-to-video production records, skills, and coverage checks"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aifilm = "aifilm.cli:main"

[tool.setuptools.packages.find]
include = ["aifilm*"]
