[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-film-production"
version = "0.1.0"
description = "Portable screenplay-to-video production records, skills, and coverage checks"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aifilm = "aifilm.cli:main"
mann = "aifilm.editor.cli:main"

[tool.setuptools.packages.find]
include = ["aifilm*"]

[tool.pytest.ini_options]
# Bare `pytest` (as CI runs it) puts tests/ on sys.path, not the repo root; add the root so `aifilm` imports.
pythonpath = ["."]
testpaths = ["tests"]
